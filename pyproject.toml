[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assembla-mcp"
version = "0.1.0"
description = "MCP server for Assembla — tickets, milestones, merge requests, tags and components as Claude tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
assembla-mcp = "assembla_mcp.server:main"